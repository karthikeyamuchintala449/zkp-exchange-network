[package]
name = "zkp_exchange_network"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkp-cli"
path = "src/main.rs"

[lib]
name = "zkp_exchange_network"
path = "src/lib.rs"

[dependencies]
#standard crypto/zk libraries mathcing your requirements
halo2_proofs = "0.3.0"
sha2 = "0.10.0"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"]}
serde_json = "1.0.0"
serde = { version = "1.0", features = ["derive"] }

ark-ff = "0.4"
ark-ec = "0.4"
ark-r1cs-std = "0.4.0"

ark-groth16 = "0.4"
ark-bls12-381 = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
num-bigint = "0.4"

log = "0.4"
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }